<!DOCTYPE html>
<!--
  Sanitized, hand-constructed Ashby-shaped application form.

  Ashby has no canonical name map (React app, no stable `name` attrs on
  most fields) — field_maps.yml relies on label/aria/placeholder fallbacks
  plus the two `input[name*=...]` fuzzy selectors
  (`defaults: {fuzzy_name_fallback: true}`). ``_common.label_selectors``
  only matches an ``<input>`` that is a DESCENDANT of a ``<label>`` (either
  ``label:has-text(...) input`` or the ``aria-label``/``placeholder``
  attribute selectors) — a sibling ``<label for="x">`` + ``<input id="x">``
  pair (the pattern Greenhouse/Lever use, where the `name` attr chain link
  matches first anyway) does NOT resolve through this chain, so this
  fixture deliberately exercises three DIFFERENT real-world shapes per the
  adapter's own docstring ("Most labels are explicit <label> elements;
  some use aria-label; some use placeholders"):
    - First Name: label WRAPS the input (`label:has-text() input`).
    - Last Name: `aria-label` attribute, no wrapping label.
    - Email: `placeholder` attribute, no label/aria at all.
    - Phone: the phone-specific chain (`input[type="tel"]:visible`).
    - LinkedIn URL: NO label/aria/placeholder at all — only the fuzzy
      `input[name*="linkedin_url"]` fallback reaches it.
  Location/Company/Title are left with no matchable selector on purpose
  (structurally present, as a real form would have them, but no
  form_answers value is supplied for them in the test — optional fields
  with no value are simply skipped, not failures).

  Cover-letter textarea and the custom question use the SAME scoped
  bare-"textarea" catch-all shape as the Greenhouse fixture (label
  association via `label[for=id]`, resolved by `_resolve_dom_label`, which
  IS sibling-aware — a different resolution path than `label_selectors`).

  A required native <select> "Are you authorized to work in this
  country?" question (a DIFFERENT DOM element from the new combobox
  below, deliberately unrelated) that field_maps.yml has never heard of
  exercises the DOM-required-set widening.

  Fix 3 addition: a SEPARATE "Work Authorization" combobox widget
  (react-select / ARIA `role="combobox"` shape) proving `select_combobox`
  is reachable end-to-end via a real `type: combobox` field_maps.yml
  spec. Ashby's widget uses the "div-wrapper" ARIA shape (role="combobox"
  on a container div, not a real <input>) — see the widget's own inline
  comment for detail — complementing the Greenhouse fixture's
  "input-direct" shape so both `_fill_combobox` code paths get exercised
  across this suite. Deliberately NOT marked required in this fixture's
  DOM, same rationale as the Greenhouse fixture (see field_maps.yml's
  spec comment).
-->
<html>
<head><title>Apply — Embedded Systems Intern at Acme Robotics (fixture)</title></head>
<body>
  <h1>Embedded Systems Intern — Acme Robotics</h1>

  <form id="application-form" action="javascript:void(0)" method="post">
    <p>
      <label>First Name
        <input type="text" required>
      </label>
    </p>
    <p>
      <input type="text" aria-label="Last Name" required>
    </p>
    <p>
      <input type="email" placeholder="Email" required>
    </p>
    <p>
      <label for="ab_phone">Phone</label>
      <input id="ab_phone" type="tel" required>
    </p>
    <p>
      <!-- No label, no aria-label, no placeholder — only the fuzzy
           input[name*="linkedin_url"] selector reaches this field. -->
      <input name="linkedin_url" type="url">
    </p>
    <p>
      <label for="ab_location">Current Location</label>
      <input id="ab_location" type="text">
    </p>
    <p>
      <label for="ab_company">Current Company</label>
      <input id="ab_company" type="text">
    </p>
    <p>
      <label for="ab_title">Current Title</label>
      <input id="ab_title" type="text">
    </p>

    <!-- Work Authorization: a react-select-style combobox widget proving
         select_combobox (Fix 3 / type: combobox field-map spec) is
         reachable end-to-end. ARIA shape: a div WRAPS a nested <input>
         (role="combobox" lives on the div, not the input) — the
         "div-wrapper" shape _fill_combobox also supports; the div has
         no .value of its own, so the post-selection readback is via
         text_content() on a chip span (see _fill_combobox's in-line
         comment on why one signal alone can't cover both ARIA shapes).
         The listbox is a sibling "portal" element, not nested inside the
         combobox div, mirroring a real react-select popup rendered
         elsewhere in the DOM (see _common.py's module note). Option text
         is the EXACT M-1 work_authorization phrase, matching the
         Greenhouse fixture's rationale (see that file's comment) for why
         an exact match is required here. This is a DIFFERENT, unrelated
         widget from the native <select> "Are you authorized to work in
         this country?" question below — the two intentionally coexist
         to prove the new combobox spec doesn't interfere with the
         pre-existing DOM-required-set widening coverage. -->
    <p>
      <label>Work Authorization</label>
      <div id="ab_work_auth_container" role="combobox" aria-label="Work Authorization" aria-expanded="false"><span id="ab_work_auth_chip"></span><input type="text" id="ab_work_auth_input"></div>
    </p>
    <ul role="listbox" id="ab_work_auth_listbox" style="display:none; list-style:none; padding:0;">
      <li role="option" data-value="us_citizen">US citizen, no sponsorship needed</li>
      <li role="option" data-value="visa">Requires visa sponsorship</li>
    </ul>
    <script>
      (function () {
        var container = document.getElementById('ab_work_auth_container');
        var chip = document.getElementById('ab_work_auth_chip');
        var listbox = document.getElementById('ab_work_auth_listbox');
        container.addEventListener('click', function () {
          listbox.style.display = 'block';
          container.setAttribute('aria-expanded', 'true');
        });
        listbox.querySelectorAll('[role="option"]').forEach(function (opt) {
          opt.addEventListener('click', function () {
            chip.textContent = opt.textContent;
            listbox.style.display = 'none';
            container.setAttribute('aria-expanded', 'false');
          });
        });
      })();
    </script>

    <p>
      <label for="ab_resume">Resume</label>
      <input id="ab_resume" type="file" accept="application/pdf" required>
    </p>

    <!-- Custom question textarea BEFORE the cover-letter box, mislabeled
         relative to "cover"/"letter". -->
    <p>
      <label for="ab_custom_q">What excites you about embedded systems?</label>
      <textarea id="ab_custom_q" rows="4" cols="60"></textarea>
    </p>

    <!-- Cover letter box: only the associated <label> resolves it, via
         the scoped bare "textarea" catch-all. -->
    <p>
      <label for="ab_cover">Cover letter — anything else you'd like to share?</label>
      <textarea id="ab_cover" rows="6" cols="60"></textarea>
    </p>

    <p>
      <label for="ab_work_auth">Are you authorized to work in this country?</label>
      <select id="ab_work_auth" aria-required="true" aria-label="Are you authorized to work in this country?" required>
        <option value="">Select...</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>
    </p>

    <p><button type="submit" id="ab-submit">Submit Application</button></p>

    <!-- Mimics a real ATS's own frontend JS: render the selected
         filename into the DOM on the file input's change event, so
         _wait_for_upload_confirmation's `text={filename}` poll has
         something to find. -->
    <script>
      document.querySelectorAll('input[type="file"]').forEach(function (inp) {
        inp.addEventListener('change', function () {
          if (inp.files && inp.files.length > 0) {
            var span = document.createElement('span');
            span.className = 'selected-file-name';
            span.textContent = 'Selected file: ' + inp.files[0].name;
            inp.insertAdjacentElement('afterend', span);
          }
        });
      });
    </script>
  </form>
</body>
</html>
